{% if site['resetPassword'] %}
<div class="signin-page">
    <div class="">
        <div class="card mx-auto simple-page-content">
            <div class="card-body">
                <form {% if site['rtl'] %}class="rtl-form"{% endif %} method="post" action="">
                   
                    <div class="mb-4">
                        <a href="/" class="d-flex align-items-center text-decoration-none text-white">
                            <img src="https://followizaddons.com/new-design/icons/logo.png" alt="Followiz" title="" class="logo-img me-2">
                            <span class="brand-txt">Follo<span class="color-primary">wiz</span></span>
                        </a>
                    </div>
                    <h6 style="font-size: 16px;" class="card-title mb-4">{{  lang('resetpassword.title') }}</h6>

                    {% if error %}
                        <div class="alert alert-dismissible alert-danger {% if site['rtl'] %} rtl-alert {% endif %}">
                        <button type="button" class="close" data-dismiss="alert">&times;</button>
                        {{ errorMessage }}
                        </div>
                    {% endif %}
                    {% if success %}
                        <div class="alert alert-dismissible alert-success {% if site['rtl'] %} rtl-alert {% endif %}">
                        <button type="button" class="close" data-dismiss="alert">&times;</button>
                            {{ successText }}
                        </div>
                    {% endif %}
                    
                    <div class="form-group">
                        <input type="email" class="form-control" id="email" name="ResetPasswordForm[email]" placeholder="{{ lang('resetpassword.email') }}">
                    </div>

                    {% if site['captcha'] %}
                        {{ captchaCode }}
                    {% endif %}
        
                    <input type="hidden" name="_csrf" value="{{csrftoken}}">
                    <button type="submit" class="btn btn-primary w-100 my-3">{{ lang('resetpassword.button.send') }}</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endif %}
